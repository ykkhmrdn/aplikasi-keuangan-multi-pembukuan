name: Deploy Production

# Trigger manual doang (workflow_dispatch), BUKAN otomatis tiap push - biar gak makan
# jatah Actions minutes tanpa kendali. Jalanin lewat: gh workflow run deploy.yml
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependency Composer (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install dependency npm & build asset
        run: |
          npm ci
          npm run build

      - name: Diagnostik koneksi ke server (sementara, buat cari tau kenapa gagal)
        run: |
          echo "Runner outbound IP:"
          curl -s https://checkip.amazonaws.com || true
          echo "Test koneksi TCP ke server (timeout 20 detik)..."
          timeout 20 bash -c "cat < /dev/tcp/${{ secrets.DEPLOY_HOST }}/${{ secrets.DEPLOY_PORT }}" && echo "TCP_OK" || echo "TCP_GAGAL"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 20 -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      # .env dan storage/ sengaja DIKECUALIKAN dari rsync - .env isinya kredensial
      # production yang cuma diatur manual lewat SSH, storage/ isinya log/cache/file
      # upload yang gak boleh ketimpa/kehapus tiap deploy.
      - name: Rsync kode ke server
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='/storage/' \
            --exclude='/node_modules/' \
            --exclude='/tests/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }}" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # storage:link Laravel gagal di hosting ini (symlink()/exec() PHP didisable
      # CloudLinux CageFS) - dibikin manual pakai ln -sfn lewat shell, bukan artisan.
      - name: Migrate + cache di server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            ln -sfn ../storage/app/public public/storage
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          '
